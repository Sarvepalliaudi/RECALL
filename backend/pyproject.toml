[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recall-backend"
version = "0.1.0"
description = "RECALL: Personal AI Memory and Semantic Search Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.2",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "google-genai>=0.1.1",
    "pymupdf>=1.23.26",
    "python-docx>=1.1.0",
    "pillow>=10.2.0",
    "pytesseract>=0.3.10",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
